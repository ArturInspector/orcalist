# NGINX конфигурация для OrcaList (tokenx.run)
# www: в DNS нужны A/AAAA (или CNAME www → @), иначе certbot с -d www.tokenx.run упадёт.
# Разместить в /etc/nginx/sites-available/tokenx.run
# Создать симлинк: ln -s /etc/nginx/sites-available/tokenx.run /etc/nginx/sites-enabled/

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name tokenx.run www.tokenx.run;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect все остальное на HTTPS
    location / {
        return 301 https://tokenx.run$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tokenx.run www.tokenx.run;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/tokenx.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenx.run/privkey.pem;
    # Без include из certbot: на чистом сервере часто нет options-ssl-nginx.conf
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Логирование
    access_log /var/log/nginx/tokenx.run.access.log;
    error_log /var/log/nginx/tokenx.run.error.log;

    # Максимальный размер загружаемых файлов (для IPFS)
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # Таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # Общие proxy настройки для всех location
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Token Service эндпоинты (Node.js на порту 3001)
    # Эти эндпоинты требуют больше времени для обработки транзакций

    location /api/create-token-metaplex {
        proxy_pass http://127.0.0.1:3001/api/create-token-metaplex;
        # убрать дублированные headers
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /api/add-metaplex-metadata {
        proxy_pass http://127.0.0.1:3001/api/add-metaplex-metadata;
        # убрать дублированные headers
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /api/send-transaction {
        proxy_pass http://127.0.0.1:3001/api/send-transaction;
        # убрать дублированные headers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Остальные API запросы → Python API на порт 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Для больших ответов (IPFS метаданные)
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Фронтенд и все остальное → Python API на порт 8000 (отдает статику)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket поддержка (если понадобится)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Кеширование статики
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|eot|ttf)$ {
            proxy_pass http://127.0.0.1:8000;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Безопасность заголовков
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Отключить логирование для favicon и robots.txt
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
